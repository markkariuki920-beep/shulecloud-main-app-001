name: ShuleCloud CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Static preflight
        run: bun run preflight

      - name: Static database security audit
        run: bun run security-audit

      - name: Secret exposure audit
        run: bun run secret-audit

      - name: Cloudflare configuration audit
        run: bun run cloudflare:check

      - name: TypeScript check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Cloudflare Pages production build
        run: bun run build:cloudflare

      - name: Scan built browser assets for secrets
        run: bun run secret-audit
